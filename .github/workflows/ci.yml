name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Cache SDL3
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: /home/runner/sdl3-prefix
          key: sdl3-${{ runner.os }}-v1

      - name: Setup SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          version-sdl-image: 3-latest
          version-sdl-ttf: 3-latest
          install-linux-dependencies: true
          prefix: /home/runner/sdl3-prefix

      - name: Configure SDL3 Environment
        run: |
          echo "LD_LIBRARY_PATH=/home/runner/sdl3-prefix/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/home/runner/sdl3-prefix/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "/home/runner/sdl3-prefix/bin" >> "$GITHUB_PATH"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Shell Scripts
        run: shellcheck examples/scripts/*.sh zigcc

      - name: Static Semantic & Type Check
        run: nim check src/nimlaunch.nim

      - name: Run Test Suite
        run: nimble test

      - name: Verify Native Release Build (GCC/Clang)
        run: nimble -y nimGeneric

      - name: Verify Portable Release Build (Zig)
        run: |
          chmod +x ./zigcc
          nimble -y zigGeneric

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: 'stable'

      - name: Setup Zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.13.0

      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47 # main
        id: sdl
        with:
          version: 3-latest
          version-sdl-image: 3-latest
          version-sdl-ttf: 3-latest
          install-linux-dependencies: true

      - name: Configure Environment
        run: |
          chmod +x ./zigcc
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDL3_ROOT/lib:$SDL3_image_ROOT/lib:$SDL3_ttf_ROOT/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$SDL3_ROOT/lib/pkgconfig:$SDL3_image_ROOT/lib/pkgconfig:$SDL3_ttf_ROOT/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "$SDL3_ROOT/bin:$SDL3_image_ROOT/bin:$SDL3_ttf_ROOT/bin" >> "$GITHUB_PATH"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Shell Scripts
        run: shellcheck examples/scripts/*.sh zigcc

      - name: Static Semantic & Type Check
        run: nim check src/nimlaunch.nim

      - name: Run Test Suite
        run: nimble test

      - name: Verify Native Release Build (GCC/Clang)
        run: nimble -y nimGeneric

      - name: Verify Portable Release Build (Zig)
        run: nimble -y zigGeneric
